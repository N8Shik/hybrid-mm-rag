[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rag-ecommerce"
version = "0.1.0"
description = "Dual-engine SQL and graph RAG prototype for Olist e-commerce data"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0",
  "neo4j>=5.0",
  "streamlit>=1.35",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

